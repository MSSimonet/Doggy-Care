# Build y pruebas en cada Pull Request y en cada push a main.
# No usa secretos: sin las variables de Supabase la app compila igual
# (muestra la pantalla de "configurar conexión") y las pruebas simulan Supabase.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-y-pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Pruebas
        run: npm test
