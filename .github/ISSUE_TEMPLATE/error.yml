name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "No incluyas datos reales de clientes (nombres, teléfonos, direcciones) ni claves."
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué viste.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir Cobros\n2. Tildar Cobrado en…\n3. …"
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: Dónde
      options: [Web (celular), Web (escritorio), App Android, Modo demo]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
